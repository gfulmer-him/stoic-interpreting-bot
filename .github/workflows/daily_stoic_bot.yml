name: Daily Stoic Reflection

on:
  schedule:
    - cron: '0 12 * * *' # Runs every day at 12:00 PM UTC
  workflow_dispatch: # Allows manual testing

jobs:
  generate-reflection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5 # v5 so it works with Node 24

      - name: Set up Python
        uses: actions/setup-python@v6 # v6 to work with Node 24
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python src/main.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Add daily Stoic reflection [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin main

      # get current date for version
      - name: Get current date
        id: date
        run: echo "date=$(date + '%Y-%m-%d')" >> $GITHUB_OUTPUT

      # release with trigger to email
      - name: Create GitHub Release (Triggers Emails)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('today_reflection.txt', 'utf8');
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: 'v' + '${{ steps.date.outputs.date }}',
              name: 'Stoic Reflection: ' + '${{ steps.date.outputs.date }}',
              body: body
            });
