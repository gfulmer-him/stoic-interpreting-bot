name: Daily Stoic Reflection

on:
  schedule:
    - cron: '0 12 * * *' # Runs every day at 12:00 PM UTC
  workflow_dispatch: # This adds a button so you can run it manually to test it

jobs:
  generate-reflection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python src/main.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add daily_reflections.md
          git commit -m "Add daily Stoic reflection [skip ci]" || exit 0
          git push
